<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <!-- Soft background shapes -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Gold seal gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft decorative circles -->
    <radialGradient id="softBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>

    <!-- SoloLearn logo gradient approximation -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Shine sweep -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect width="800" height="560" rx="12"/></clipPath>

    <style>
      /* entrance: fade and rise */
      .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
      .r1 { animation-delay: 0.3s; }
      .r2 { animation-delay: 0.7s; }
      .r3 { animation-delay: 1.1s; }
      .r4 { animation-delay: 1.6s; }
      .r5 { animation-delay: 1.85s; }
      .r6 { animation-delay: 2.2s; }
      .r7 { animation-delay: 3.0s; }
      .r8 { animation-delay: 3.3s; }
      .r9 { animation-delay: 3.45s; }
      .r10 { animation-delay: 4.6s; }

      /* border draws itself */
      .border { stroke-dasharray: 2700; stroke-dashoffset: 2700; animation: draw 2.2s ease-out 0.1s forwards; }

      /* floating soft circles */
      .float { transform-box: fill-box; transform-origin: center; animation: drift 7s ease-in-out infinite alternate; }
      .f2 { animation-duration: 9s; animation-delay: -2s; }
      .f3 { animation-duration: 6s; animation-delay: -4s; }
      .f4 { animation-duration: 8s; animation-delay: -1s; }

      /* gold seal: pop in, then glow and shine */
      .seal { transform-box: fill-box; transform-origin: center; opacity: 0;
              animation: stamp 0.9s cubic-bezier(.2,1.4,.4,1) 2.5s forwards; }
      .sealring { transform-box: fill-box; transform-origin: center; opacity: 0;
              animation: ringpulse 2.6s ease-out 3.4s infinite; }
      .star { animation: twinkle 2.4s ease-in-out infinite; }
      .s1 { animation-delay: 3.4s; } .s2 { animation-delay: 3.6s; } .s3 { animation-delay: 3.8s; }
      .s4 { animation-delay: 4.0s; } .s5 { animation-delay: 4.2s; }

      /* signature writes itself */
      .sig { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.4s ease-in-out 3.5s forwards; }

      /* shine sweeping across the card */
      .shine { animation: sweep 7s ease-in-out 5s infinite; }

      @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw  { to { stroke-dashoffset: 0; } }
      @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-14px, 12px) scale(1.08); } }
      @keyframes stamp { 0% { opacity: 0; transform: scale(2.2) rotate(-25deg); }
                         60% { opacity: 1; transform: scale(.92) rotate(4deg); }
                         100% { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes ringpulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.5); } }
      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes sweep { 0% { transform: translateX(-300px) skewX(-20deg); }
                         35%, 100% { transform: translateX(1100px) skewX(-20deg); } }
    </style>
  </defs>

  <!-- Main certificate background -->
  <rect width="800" height="560" rx="12" fill="url(#bgGrad)"/>

  <!-- Decorative diagonal ribbon (light blue) -->
  <path d="M0 380 L180 560 L0 560 Z" fill="#cbd5e1" opacity="0.4"/>
  <path d="M0 340 L220 560 L0 560 Z" fill="#e2e8f0" opacity="0.3"/>

  <!-- Soft decorative circles on the right -->
  <circle class="float" cx="680" cy="80" r="90" fill="url(#softBlue)"/>
  <circle class="float f2" cx="740" cy="160" r="70" fill="url(#softPink)"/>
  <circle class="float f3" cx="620" cy="40" r="50" fill="url(#softYellow)"/>
  <circle class="float f4" cx="760" cy="280" r="60" fill="url(#softBlue)" opacity="0.4"/>

  <!-- Top title -->
  <text class="rise r1" x="400" y="70" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" letter-spacing="3" fill="#64748b">
    COURSE CERTIFICATE
  </text>

  <!-- "This is to certify that" -->
  <text class="rise r2" x="400" y="140" text-anchor="middle"
        font-family="Georgia, serif" font-size="16" fill="#64748b">
    This is to certify that
  </text>

  <!-- Name -->
  <text class="rise r3" x="400" y="195" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="bold" fill="#1e293b">
    Reabetswe Matake
  </text>

  <!-- Description -->
  <g class="rise r4">
    <text x="400" y="240" text-anchor="middle"
          font-family="Georgia, serif" font-size="15" fill="#64748b">
      has successfully completed the course by demonstrating
    </text>
    <text x="400" y="262" text-anchor="middle"
          font-family="Georgia, serif" font-size="15" fill="#64748b">
      theoretical and practical understanding of
    </text>
  </g>

  <!-- Course name -->
  <text class="rise r5" x="400" y="320" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="bold" fill="#1e293b">
    Machine Learning for Beginners
  </text>

  <!-- Gold Seal -->
  <g transform="translate(120, 400)">
    <circle class="sealring" cx="0" cy="0" r="58" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <g class="seal">
      <circle cx="0" cy="0" r="58" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#fef3c7" stroke-width="2"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#fef3c7" stroke-width="1"/>

      <text x="0" y="-12" text-anchor="middle"
            font-family="Arial, sans-serif" font-size="11" font-weight="bold"
            fill="#78350f" letter-spacing="1">
        COURSE
      </text>
      <text x="0" y="6" text-anchor="middle"
            font-family="Arial, sans-serif" font-size="11" font-weight="bold"
            fill="#78350f" letter-spacing="1">
        COMPLETED
      </text>

      <text x="0" y="28" text-anchor="middle" font-size="12" fill="#78350f">
        <tspan class="star s1">★</tspan><tspan class="star s2">★</tspan><tspan class="star s3">★</tspan><tspan class="star s4">★</tspan><tspan class="star s5">★</tspan>
      </text>
    </g>
  </g>

  <!-- SoloLearn logo + text (bottom center) -->
  <g class="rise r7">
    <g transform="translate(340, 430)">
      <circle cx="12" cy="12" r="12" fill="url(#logoGrad)"/>
      <text x="32" y="17"
            font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1e293b">
        sololearn
      </text>
    </g>
  </g>

  <!-- Certificate ID and date -->
  <text class="rise r8" x="400" y="490" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">
    Certificate CC-NQHM1GR7
  </text>
  <text class="rise r9" x="400" y="508" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">
    Issued 26 September, 2026
  </text>

  <!-- Signature area -->
  <g transform="translate(580, 380)">
    <path class="sig" d="M10 30 C20 10, 40 15, 50 25 C60 35, 70 20, 85 30 C95 38, 100 25, 110 30"
          fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

    <g class="rise r10">
      <text x="60" y="55" text-anchor="middle"
            font-family="Arial, sans-serif" font-size="13" fill="#334155">
        Yeva Hyusyan
      </text>
      <text x="60" y="72" text-anchor="middle"
            font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        Chief Executive Officer
      </text>
    </g>
  </g>

  <!-- Shine sweep across the card -->
  <g clip-path="url(#cardClip)">
    <rect class="shine" x="0" y="-20" width="140" height="600" fill="url(#shineGrad)"/>
  </g>

  <!-- Thin border (draws itself) -->
  <rect class="border" x="8" y="8" width="784" height="544" rx="8"
        fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>
